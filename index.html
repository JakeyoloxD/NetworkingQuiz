<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cisco Drill</title>
  <style>
:root{
  --bg:#0b0e14;
  --card:#0f1422;
  --text:#e7e9ee;
  --muted:#a7adbb;
  --accent:#5dd8ff;
  --ok:#21c55d;
  --bad:#ef4444;
  --warn:#f59e0b;
  --border:#1e2639;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font:16px/1.4 system-ui,Segoe UI,Roboto,Apple Color Emoji;
  background:linear-gradient(180deg,#0b0e14 0%,#10172a 100%);
  color:var(--text);
}
.topbar{
  display:grid; grid-template-columns:auto 1fr auto; gap:12px;
  align-items:center; padding:16px; border-bottom:1px solid var(--border);
  position:sticky; top:0; background:rgba(11,14,20,.9); backdrop-filter:blur(6px);
}
h1{margin:0; font-size:18px; letter-spacing:.5px}
.progress-wrap{height:8px; background:#111827; border-radius:999px; overflow:hidden}
.progress-bar{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),#7c3aed)}
.progress-text{color:var(--muted); font-size:13px}

.container{max-width:900px; margin:32px auto; padding:0 16px}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.02));
  border:1px solid var(--border); border-radius:16px; padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
.meta{display:flex; gap:8px; margin-bottom:6px}
.pill{
  display:inline-block; padding:4px 10px; border-radius:999px;
  font-size:12px; color:#cbd5e1; background:#111827; border:1px solid #1f2937;
}
.question{margin:8px 0 16px 0; font-size:20px}

.choices{display:grid; gap:10px}
.choice{
  padding:12px 14px; border-radius:12px; border:1px solid var(--border);
  background:#0c1324; cursor:pointer; text-align:left;
  transition:transform .06s ease,border-color .2s ease,box-shadow .2s ease;
}
.choice:hover{transform:translateY(-1px)}
.choice[disabled]{opacity:.55; cursor:not-allowed}

.choice.correct{
  border-color:rgba(33,197,93,.6); background:rgba(33,197,93,.08);
  box-shadow:0 0 0 2px rgba(33,197,93,.25) inset;
}
.choice.wrong{
  border-color:rgba(239,68,68,.65); background:rgba(239,68,68,.08);
  animation:shake .28s linear 1;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}

.feedback{min-height:26px; margin:8px 2px; font-weight:600}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--bad)}
.feedback.warn{color:var(--warn)}

.explain{margin-top:12px; padding:12px; border:1px dashed #243044; border-radius:12px; background:#0b1222}
.explain.hidden{display:none}
.explain-title{font-weight:700; margin-bottom:4px; font-size:14px}
.refs{margin-top:8px; font-size:13px}
.refs a{color:#93c5fd; text-decoration:none}
.refs a:hover{text-decoration:underline}
.tag{
  display:inline-block; padding:2px 8px; margin:2px 2px 0 0;
  border-radius:999px; font-size:12px; color:#93c5fd;
  background:#0c1324; border:1px solid #1f2937;
}

.controls{display:flex; gap:10px; margin-top:16px}
.btn{
  padding:10px 14px; border-radius:12px; border:1px solid var(--border);
  background:#0f172a; color:var(--text); cursor:pointer
}
.btn.primary{background:#1f2a44; border-color:#2c3a5f}
.btn[disabled]{opacity:.5; cursor:not-allowed}

.foot{
  margin:24px auto 40px; max-width:900px; padding:0 16px;
  display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:13px;
}
.toggle{display:flex; align-items:center; gap:8px; user-select:none}

/* ---- nav / views ---- */
.nav{display:flex; gap:8px; margin:20px auto 0; padding:0 16px}
.tab{
  padding:9px 16px; border-radius:10px 10px 0 0; border:1px solid var(--border);
  border-bottom:none; background:#0c1324; color:var(--muted); cursor:pointer;
  font-size:14px; font-weight:600;
}
.tab.active{background:#1f2a44; color:var(--text); border-color:#2c3a5f}
.view{display:none}
.view.active{display:block}
body[data-view="drill"] .progress-wrap,
body[data-view="drill"] .progress-text{visibility:hidden}

/* ---- drill ---- */
.drill-head{
  display:flex; flex-wrap:wrap; gap:12px; align-items:center;
  justify-content:space-between; margin-bottom:14px;
}
.seg{display:inline-flex; border:1px solid var(--border); border-radius:10px; overflow:hidden}
.seg-btn{
  padding:8px 14px; background:#0c1324; color:var(--muted); border:none;
  cursor:pointer; font-size:13px; font-weight:600;
}
.seg-btn.active{background:#1f2a44; color:var(--text)}
.drill-actions{display:flex; gap:8px; flex-wrap:wrap}

.prompt{margin:0 0 14px; font-size:16px; color:var(--text)}
.prompt b{color:var(--accent)}

.qgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px}
.field{display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted)}
.field input{
  padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  background:#0c1324; color:var(--text); font-size:15px; font-family:ui-monospace,monospace;
}
.field input:focus{outline:none; border-color:var(--accent)}

.tbl-wrap{overflow-x:auto}
table.vlsm{width:100%; border-collapse:collapse; font-size:13px}
table.vlsm th, table.vlsm td{
  padding:8px 10px; border:1px solid var(--border); text-align:left; white-space:nowrap;
}
table.vlsm th{background:#0c1324; color:var(--muted); font-weight:600}
table.vlsm td:first-child{font-weight:600}
input.vc{
  padding:6px 8px; border-radius:8px; border:1px solid var(--border);
  background:#0b1222; color:var(--text); font-family:ui-monospace,monospace; font-size:13px;
}
input.vc:focus{outline:none; border-color:var(--accent)}
.cell-ok{border-color:rgba(33,197,93,.7) !important; background:rgba(33,197,93,.10) !important}
.cell-bad{border-color:rgba(239,68,68,.75) !important; background:rgba(239,68,68,.10) !important}

.cheat{margin-top:16px; border:1px dashed #243044; border-radius:12px; background:#0b1222}
.cheat summary{cursor:pointer; padding:10px 12px; font-weight:600; font-size:14px}
.cheat-body{padding:0 12px 12px; color:var(--muted); font-size:13px}
.cheat-body p{margin:6px 0}
.cheat-body b{color:var(--accent)}

/* ---- worksheet ---- */
.ws-head{display:flex; flex-wrap:wrap; gap:18px; margin-bottom:18px; align-items:flex-start}
.ws-req{flex:0 0 auto}
.ws-ref{flex:1 1 480px; min-width:0}
.ws-title{font-weight:700; font-size:14px; color:var(--text); margin:0 0 8px;
  display:flex; align-items:center; gap:10px}
.linklike{background:none; border:none; color:var(--accent); cursor:pointer;
  font-size:12px; padding:0; text-decoration:underline}
.ws-base{margin-top:10px; font-size:13px; color:var(--muted)}
.ws-base b{color:var(--accent); font-family:ui-monospace,monospace; font-size:14px}

table.mini{border-collapse:collapse; font-size:13px}
table.mini th, table.mini td{border:1px solid var(--border); padding:5px 12px; text-align:left}
table.mini th{background:#0c1324; color:var(--muted)}
table.mini tr.tot td{font-weight:700; color:var(--accent); background:#0b1222}

table.ref{border-collapse:collapse; font-size:11px; width:100%}
table.ref th, table.ref td{border:1px solid var(--border); padding:4px 6px;
  text-align:center; white-space:nowrap; font-family:ui-monospace,monospace}
table.ref th{background:#0c1324; color:var(--muted)}
table.ref tr td:first-child, table.ref tr th:first-child{position:sticky; left:0;
  background:#0c1324; color:var(--muted); text-align:left; font-family:system-ui}

/* ---- IOS commands ---- */
.legend{display:flex; flex-wrap:wrap; gap:14px; align-items:center;
  font-size:12px; color:var(--muted); margin-bottom:16px}
.mbadge{display:inline-block; padding:2px 7px; border-radius:6px; font-size:11px;
  font-family:ui-monospace,monospace; border:1px solid var(--border); background:#0c1324}
.m-ex{color:#9ca3af} .m-pr{color:#fbbf24} .m-g{color:#5dd8ff}
.m-l{color:#a78bfa} .m-if{color:#34d399}

.phase{margin-bottom:22px}
.phase-title{font-weight:700; font-size:15px; color:var(--text); margin-bottom:4px}
.phase-why{font-size:13px; color:var(--muted); margin-bottom:10px; max-width:720px}
table.cmd-table{width:100%; border-collapse:collapse; font-size:13px}
table.cmd-table th, table.cmd-table td{border:1px solid var(--border);
  padding:8px 10px; text-align:left; vertical-align:top}
table.cmd-table th{background:#0c1324; color:var(--muted); font-weight:600}
table.cmd-table td:first-child{white-space:nowrap; text-align:center}
table.cmd-table code{font-family:ui-monospace,monospace; color:var(--accent); font-size:13px}
.abbr{display:block; font-size:11px; color:var(--muted); font-family:ui-monospace,monospace; margin-top:2px}

.cmd-task{font-size:18px; color:var(--text); margin:6px 0 16px}
.mode-name{font-size:13px; color:var(--muted)}
.cmd-entry{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
#cmdInput{flex:1 1 320px; padding:11px 14px; border-radius:10px; border:1px solid var(--border);
  background:#0c1324; color:var(--text); font-family:ui-monospace,monospace; font-size:15px}
#cmdInput:focus{outline:none; border-color:var(--accent)}
.feedback code, .cmd-task code{font-family:ui-monospace,monospace; color:var(--accent)}
.cmd-score{margin-top:14px; color:var(--muted); font-size:13px}

</style>
</head>
<body>
  <header class="topbar">
    <h1>Cisco Drill</h1>
    <div class="progress-wrap" aria-label="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div id="progressText" class="progress-text">0 / 0</div>
  </header>

  <nav class="nav container">
    <button class="tab active" data-view="quiz">Quiz</button>
    <button class="tab" data-view="drill">Subnetting Drill</button>
    <button class="tab" data-view="commands">IOS Commands</button>
  </nav>

  <main class="container">
    <div id="quizView" class="view active">
      <section id="card" class="card" aria-live="polite">
        <div class="meta">
          <span id="domain" class="pill"></span>
          <span id="difficulty" class="pill"></span>
        </div>
        <h2 id="questionText" class="question">Loading...</h2>

        <div id="choices" class="choices" role="listbox" aria-label="answer choices"></div>

        <div id="feedback" class="feedback" aria-live="polite"></div>

        <div id="explain" class="explain hidden">
          <div class="explain-title">Why this is correct</div>
          <div id="explainText"></div>
          <div id="refs" class="refs"></div>
        </div>

        <div class="controls">
          <button id="nextBtn" class="btn primary" disabled>Next</button>
          <button id="resetBtn" class="btn">Reset</button>
        </div>
      </section>
    </div>

    <div id="drillView" class="view"></div>
    <div id="commandsView" class="view"></div>
  </main>

  <footer class="foot">
    <span>Study smart. Ship fast.</span>
    <label class="toggle">
      <input id="persistToggle" type="checkbox" />
      <span>Save progress</span>
    </label>
  </footer>

  <script>
/* Subnetting Drill — VLSM generator + grader
   Pure math is isolated so it can be unit-tested in node.
   UI hooks live below the CORE section and only touch the DOM when called.
*/

/* ===================== CORE (pure, testable) ===================== */

function ipToInt(ip) {
  const p = ip.split(".").map(Number);
  return p[0] * 16777216 + p[1] * 65536 + p[2] * 256 + p[3];
}
function intToIp(n) {
  return [
    Math.floor(n / 16777216) % 256,
    Math.floor(n / 65536) % 256,
    Math.floor(n / 256) % 256,
    n % 256,
  ].join(".");
}
function prefixToMask(p) {
  if (p <= 0) return "0.0.0.0";
  const m = (0xffffffff << (32 - p)) >>> 0;
  return intToIp(m);
}
// smallest h where 2^h - 2 >= hosts (classic usable-host rule, min /30)
function hostBitsForHosts(hosts) {
  const need = Math.max(1, hosts);
  let h = 1;
  while (Math.pow(2, h) - 2 < need) h++;
  return h;
}
function nextPow2(n) {
  let p = 1;
  while (p < n) p *= 2;
  return p;
}

// Allocate requirements over a base block, largest-first (standard VLSM).
// requirements: [{label, hosts}]  -> [{label, hosts, h, prefix, block, mask,
//   network, firstHost, lastHost, broadcast, usable}]
function allocate(baseIp, basePrefix, requirements) {
  const sorted = [...requirements].sort((a, b) => b.hosts - a.hosts);
  let ptr = ipToInt(baseIp);
  const baseEnd = ptr + Math.pow(2, 32 - basePrefix) - 1;
  const out = [];
  for (const req of sorted) {
    const h = hostBitsForHosts(req.hosts);
    const block = Math.pow(2, h);
    const prefix = 32 - h;
    const network = ptr;
    const broadcast = ptr + block - 1;
    if (broadcast > baseEnd) throw new Error("does not fit in base block");
    out.push({
      label: req.label,
      hosts: req.hosts,
      h,
      prefix,
      block,
      mask: prefixToMask(prefix),
      network: intToIp(network),
      firstHost: intToIp(network + 1),
      lastHost: intToIp(broadcast - 1),
      broadcast: intToIp(broadcast),
      usable: block - 2,
    });
    ptr = broadcast + 1;
  }
  return out;
}

function randInt(a, b) {
  return Math.floor(Math.random() * (b - a + 1)) + a;
}

// Generate a random, always-solvable VLSM problem.
function genProblem() {
  const n = randInt(3, 5);
  const lanNames = [
    "HQ", "Branch", "Sales", "Engineering", "Warehouse",
    "Lab", "Guest", "Mgmt", "Voice", "Servers", "Finance", "Support",
  ];
  const names = [...lanNames].sort(() => Math.random() - 0.5);

  const reqs = [];
  for (let i = 0; i < n - 1; i++) {
    const bucket = randInt(1, 3);
    let hosts;
    if (bucket === 1) hosts = randInt(500, 3000);     // large LAN
    else if (bucket === 2) hosts = randInt(60, 500);  // medium LAN
    else hosts = randInt(10, 60);                      // small LAN
    reqs.push({ label: names[i], hosts });
  }
  // always include at least one point-to-point WAN link
  reqs.push({ label: "WAN-Link", hosts: 2 });

  const blocks = reqs.map((r) => Math.pow(2, hostBitsForHosts(r.hosts)));
  const sum = blocks.reduce((a, b) => a + b, 0);
  const largest = Math.max(...blocks);
  const baseBlock = Math.max(nextPow2(sum), largest);
  const basePrefix = 32 - Math.log2(baseBlock);

  // random aligned base, first octet kept in a normal-looking range
  const maxStart = Math.pow(2, 32) - baseBlock;
  const lowStart = 11 * 16777216; // 11.0.0.0
  const highStart = Math.min(maxStart, 199 * 16777216);
  const slots = Math.floor((highStart - lowStart) / baseBlock);
  const baseInt = lowStart + randInt(0, slots) * baseBlock;

  return {
    baseIp: intToIp(baseInt),
    basePrefix,
    requirements: reqs,
    solution: allocate(intToIp(baseInt), basePrefix, reqs),
  };
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    ipToInt, intToIp, prefixToMask, hostBitsForHosts,
    nextPow2, allocate, genProblem,
  };
}

/* ===================== UI ===================== */

const sub = {
  mode: "vlsm", // 'quick' | 'vlsm'
  problem: null,
  quick: null,
};

function normIp(s) {
  return String(s).trim();
}
function normPrefix(s) {
  return String(s).trim().replace(/^\/+/, "");
}

function initSubnetDrill() {
  const root = document.getElementById("drillView");
  if (!root) return;

  root.innerHTML = `
    <section class="card">
      <div class="drill-head">
        <div class="seg">
          <button class="seg-btn active" data-mode="vlsm">Full VLSM</button>
          <button class="seg-btn" data-mode="quick">Quick (single subnet)</button>
        </div>
        <div class="drill-actions">
          <button id="newProblem" class="btn primary">New problem</button>
          <button id="checkAnswers" class="btn">Check</button>
          <button id="revealAnswers" class="btn">Reveal</button>
        </div>
      </div>
      <div id="drillBody"></div>
      <div id="drillScore" class="feedback"></div>
      <details class="cheat">
        <summary>Cheat sheet</summary>
        <div class="cheat-body">
          <p><b>usable = 2^h − 2</b> &nbsp; prefix = 32 − h &nbsp; block = 2^h</p>
          <p>Powers: 2 4 8 16 32 64 128 256 512 1024 2048 4096</p>
          <p>Mask: /25=128 /26=192 /27=224 /28=240 /29=248 /30=252 /31=254 /32=255</p>
          <p>Sort largest hosts first. Next subnet = previous broadcast + 1.</p>
        </div>
      </details>
    </section>
  `;

  root.querySelectorAll(".seg-btn").forEach((b) => {
    b.addEventListener("click", () => {
      root.querySelectorAll(".seg-btn").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
      sub.mode = b.dataset.mode;
      newProblem();
    });
  });
  document.getElementById("newProblem").addEventListener("click", newProblem);
  document.getElementById("checkAnswers").addEventListener("click", checkAnswers);
  document.getElementById("revealAnswers").addEventListener("click", revealAnswers);

  newProblem();
}

function newProblem() {
  document.getElementById("drillScore").textContent = "";
  document.getElementById("drillScore").className = "feedback";
  if (sub.mode === "quick") renderQuick();
  else renderVlsm();
}

/* ---------- Quick mode: one requirement, drill the formula ---------- */
function renderQuick() {
  const hosts = randInt(2, 4000);
  const h = hostBitsForHosts(hosts);
  sub.quick = {
    hosts, h,
    prefix: 32 - h,
    block: Math.pow(2, h),
    mask: prefixToMask(32 - h),
    usable: Math.pow(2, h) - 2,
  };
  const body = document.getElementById("drillBody");
  body.innerHTML = `
    <p class="prompt">You need <b>${hosts}</b> usable hosts. Size the smallest subnet that fits.</p>
    <div class="qgrid">
      ${qField("Host bits (h)", "q_h")}
      ${qField("Prefix (/n)", "q_prefix")}
      ${qField("Block size", "q_block")}
      ${qField("Subnet mask", "q_mask")}
      ${qField("Usable hosts", "q_usable")}
    </div>
  `;
}
function qField(label, id) {
  return `<label class="field"><span>${label}</span>
    <input id="${id}" type="text" autocomplete="off" spellcheck="false" /></label>`;
}

/* ---------- VLSM mode: full worksheet grid ---------- */
function refChartHtml() {
  const pfxs = [];
  for (let p = 17; p <= 32; p++) pfxs.push(p);
  const head = pfxs.map((p) => `<th>/${p}</th>`).join("");
  const mask = pfxs.map((p) => `<td>${prefixToMask(p)}</td>`).join("");
  const block = pfxs.map((p) => `<td>${Math.pow(2, 32 - p)}</td>`).join("");
  const usable = pfxs.map((p) => `<td>${Math.max(Math.pow(2, 32 - p) - 2, 0)}</td>`).join("");
  const jump = pfxs.map((p) => {
    const b = Math.pow(2, 32 - p);
    const oct = b < 256 ? "4th" : "3rd";
    const v = b < 256 ? b : b / 256;
    return `<td>${oct} +${v}</td>`;
  }).join("");
  return `<table class="ref">
    <tr><th>Prefix</th>${head}</tr>
    <tr><th>Mask</th>${mask}</tr>
    <tr><th>Block</th>${block}</tr>
    <tr><th>Usable</th>${usable}</tr>
    <tr><th>Jump</th>${jump}</tr>
  </table>`;
}

function renderVlsm() {
  sub.problem = genProblem();
  const p = sub.problem;
  const rows = [...p.requirements].sort((a, b) => b.hosts - a.hosts);
  const total = p.requirements.reduce((a, r) => a + r.hosts, 0);
  const body = document.getElementById("drillBody");
  body.innerHTML = `
    <div class="ws-head">
      <div class="ws-req">
        <div class="ws-title">Requirements</div>
        <table class="mini">
          <tr><th>Subnet</th><th>Hosts</th></tr>
          ${p.requirements.map((r) => `<tr><td>${r.label}</td><td>${r.hosts}</td></tr>`).join("")}
          <tr class="tot"><td>Total</td><td>${total}</td></tr>
        </table>
        <div class="ws-base">Primary network<br><b>${p.baseIp}/${p.basePrefix}</b></div>
      </div>
      <div class="ws-ref">
        <div class="ws-title">Reference chart
          <button id="toggleRef" class="linklike" type="button">hide to test myself</button>
        </div>
        <div id="refWrap" class="tbl-wrap">${refChartHtml()}</div>
      </div>
    </div>

    <div class="ws-title">Allocation — fill it in (sorted largest first)</div>
    <div class="tbl-wrap">
    <table class="vlsm">
      <thead><tr>
        <th>Subnet</th><th>Hosts</th><th>Block</th><th>Prefix</th><th>Mask</th>
        <th>Network</th><th>1st host</th><th>Last host</th><th>Broadcast</th>
      </tr></thead>
      <tbody>
        ${rows.map((r, i) => `
          <tr data-row="${i}">
            <td>${r.label}</td>
            <td>${r.hosts}</td>
            ${cell(i, "block", 6)}
            ${cell(i, "prefix", 4)}
            ${cell(i, "mask", 14)}
            ${cell(i, "network", 14)}
            ${cell(i, "firstHost", 14)}
            ${cell(i, "lastHost", 14)}
            ${cell(i, "broadcast", 14)}
          </tr>`).join("")}
      </tbody>
    </table>
    </div>
  `;
  const tref = document.getElementById("toggleRef");
  tref.addEventListener("click", () => {
    const w = document.getElementById("refWrap");
    const hidden = w.style.display === "none";
    w.style.display = hidden ? "" : "none";
    tref.textContent = hidden ? "hide to test myself" : "show reference";
  });
}
function cell(row, field, size) {
  return `<td><input class="vc" data-row="${row}" data-field="${field}"
    size="${size}" type="text" autocomplete="off" spellcheck="false" /></td>`;
}

/* ---------- Grading ---------- */
function markInput(el, ok) {
  el.classList.remove("cell-ok", "cell-bad");
  el.classList.add(ok ? "cell-ok" : "cell-bad");
}

function checkAnswers() {
  if (sub.mode === "quick") return checkQuick();
  return checkVlsm();
}

function checkQuick() {
  const q = sub.quick;
  const checks = [
    ["q_h", String(q.h)],
    ["q_prefix", String(q.prefix)],
    ["q_block", String(q.block)],
    ["q_mask", q.mask],
    ["q_usable", String(q.usable)],
  ];
  let correct = 0;
  checks.forEach(([id, want]) => {
    const el = document.getElementById(id);
    let val = el.value.trim();
    if (id === "q_prefix") val = normPrefix(val);
    const ok = val === want;
    if (ok) correct++;
    markInput(el, ok);
  });
  score(correct, checks.length);
}

function checkVlsm() {
  const sol = sub.problem.solution; // already sorted largest first
  const inputs = document.querySelectorAll(".vc");
  let correct = 0, total = 0;
  inputs.forEach((el) => {
    const row = +el.dataset.row;
    const field = el.dataset.field;
    const want = String(sol[row][field]);
    let val = el.value.trim();
    if (field === "prefix") val = normPrefix(val);
    else val = normIp(val);
    const ok = val === want;
    total++;
    if (ok) correct++;
    markInput(el, ok);
  });
  score(correct, total);
}

function revealAnswers() {
  if (sub.mode === "quick") {
    const q = sub.quick;
    const map = {
      q_h: q.h, q_prefix: "/" + q.prefix, q_block: q.block,
      q_mask: q.mask, q_usable: q.usable,
    };
    Object.entries(map).forEach(([id, v]) => {
      const el = document.getElementById(id);
      el.value = v;
      el.classList.remove("cell-bad");
      el.classList.add("cell-ok");
    });
  } else {
    const sol = sub.problem.solution;
    document.querySelectorAll(".vc").forEach((el) => {
      const v = sol[+el.dataset.row][el.dataset.field];
      el.value = el.dataset.field === "prefix" ? "/" + v : v;
      el.classList.remove("cell-bad");
      el.classList.add("cell-ok");
    });
  }
  const s = document.getElementById("drillScore");
  s.textContent = "Answers revealed.";
  s.className = "feedback warn";
}

function score(correct, total) {
  const s = document.getElementById("drillScore");
  s.textContent = `${correct} / ${total} correct.` +
    (correct === total ? " Clean sheet." : " Fix the red cells.");
  s.className = "feedback " + (correct === total ? "ok" : "bad");
}

/* Cisco IOS commands — ordered reference + recall drill.
   Modes: ex=user EXEC (>), pr=privileged EXEC (#), g=global (config),
          l=line (config-line), if=interface (config-if)
*/

const MODES = {
  ex: { badge: ">", full: "User EXEC" },
  pr: { badge: "#", full: "Privileged EXEC" },
  g: { badge: "(config)", full: "Global config" },
  l: { badge: "(config-line)", full: "Line config" },
  if: { badge: "(config-if)", full: "Interface config" },
};

const PHASES = [
  {
    title: "1. Get into configuration mode",
    why: "Every config command lives below global config. You always start here.",
    steps: [
      { cmd: "enable", mode: "ex", desc: "Move from user EXEC (>) to privileged EXEC (#).", alt: ["en"] },
      { cmd: "configure terminal", mode: "pr", desc: "Enter global configuration mode.", alt: ["conf t", "config t", "configure t"] },
    ],
  },
  {
    title: "2. Identity and base security",
    why: "Name the box, lock privileged mode, then encrypt any plaintext passwords so the rest of the config is protected as you type it.",
    steps: [
      { cmd: "hostname R1", mode: "g", desc: "Set the device name to R1.", alt: [] },
      { cmd: "enable secret class", mode: "g", desc: "Encrypted password to enter privileged EXEC. Preferred over 'enable password'.", alt: [] },
      { cmd: "service password-encryption", mode: "g", desc: "Weakly encrypt all plaintext passwords shown in the config.", alt: [] },
      { cmd: "banner motd #Authorized access only#", mode: "g", desc: "Message-of-the-day banner shown before login.", alt: [] },
    ],
  },
  {
    title: "3. Console and VTY line access",
    why: "Console = physical port. VTY = remote sessions (Telnet/SSH). Restrict VTY to SSH only and authenticate against the local user database.",
    steps: [
      { cmd: "line console 0", mode: "g", desc: "Enter console line configuration.", alt: ["line con 0"] },
      { cmd: "password cisco", mode: "l", desc: "Set the line password.", alt: [] },
      { cmd: "login", mode: "l", desc: "Require the line password at login.", alt: [] },
      { cmd: "logging synchronous", mode: "l", desc: "Stop console log messages from interrupting what you type.", alt: [] },
      { cmd: "exec-timeout 5 0", mode: "l", desc: "Auto log-out after 5 minutes idle (5 min, 0 sec).", alt: [] },
      { cmd: "line vty 0 15", mode: "g", desc: "Enter all 16 virtual terminal lines for remote access.", alt: [] },
      { cmd: "login local", mode: "l", desc: "Authenticate remote logins against the local username database.", alt: [] },
      { cmd: "transport input ssh", mode: "l", desc: "Allow only SSH on the VTY lines (block Telnet).", alt: [] },
    ],
  },
  {
    title: "4. Enable SSH (remote management)",
    why: "Order matters: hostname and domain-name must exist before the RSA key will generate, and the key must exist before SSH works.",
    steps: [
      { cmd: "username admin secret cisco", mode: "g", desc: "Create a local user with an encrypted password (needed for 'login local').", alt: [] },
      { cmd: "ip domain-name lab.local", mode: "g", desc: "Set the domain name; the RSA key is named host.domain.", alt: ["ip domain name lab.local"] },
      { cmd: "crypto key generate rsa", mode: "g", desc: "Generate the RSA key pair for SSH (use a 1024-bit+ modulus when prompted).", alt: [] },
      { cmd: "ip ssh version 2", mode: "g", desc: "Force the more secure SSH version 2.", alt: [] },
    ],
  },
  {
    title: "5. IP addressing",
    why: "Routers address physical interfaces. Switches get one management IP on an SVI plus a default gateway. Interfaces come up only after 'no shutdown'.",
    steps: [
      { cmd: "interface gigabitEthernet 0/0", mode: "g", desc: "Router: enter a physical interface.", alt: ["int g0/0", "interface g0/0", "int gig0/0"] },
      { cmd: "ip address 192.168.1.1 255.255.255.0", mode: "if", desc: "Assign an IP address and mask to the interface.", alt: [] },
      { cmd: "no shutdown", mode: "if", desc: "Administratively enable the interface (router ports are down by default).", alt: ["no shut"] },
      { cmd: "interface vlan 1", mode: "g", desc: "Switch: enter the management SVI.", alt: ["int vlan 1"] },
      { cmd: "ip default-gateway 192.168.1.1", mode: "g", desc: "Switch: set the default gateway so it can be reached off-subnet.", alt: [] },
    ],
  },
  {
    title: "6. Switch port security",
    why: "Lock an access port to known MAC addresses. Set access mode first, then enable security, limit MACs, learn them stickily, and choose the violation action.",
    steps: [
      { cmd: "interface fastEthernet 0/1", mode: "g", desc: "Enter the access port to secure.", alt: ["int f0/1", "interface f0/1", "int fa0/1"] },
      { cmd: "switchport mode access", mode: "if", desc: "Force the port to access mode (port security needs this).", alt: [] },
      { cmd: "switchport port-security", mode: "if", desc: "Enable port security on the interface.", alt: [] },
      { cmd: "switchport port-security maximum 2", mode: "if", desc: "Allow at most 2 learned MAC addresses.", alt: [] },
      { cmd: "switchport port-security mac-address sticky", mode: "if", desc: "Dynamically learn MACs and save them to the running config.", alt: [] },
      { cmd: "switchport port-security violation shutdown", mode: "if", desc: "Err-disable the port if an unknown MAC appears.", alt: [] },
    ],
  },
  {
    title: "7. Save and verify",
    why: "The running config is in RAM and lost on reload. Save it to NVRAM, then check your work with show commands.",
    steps: [
      { cmd: "end", mode: "if", desc: "Jump straight back to privileged EXEC from any config mode.", alt: [] },
      { cmd: "copy running-config startup-config", mode: "pr", desc: "Save the running config to NVRAM so it survives a reboot.", alt: ["copy run start", "write memory", "wr"] },
      { cmd: "show ip interface brief", mode: "pr", desc: "List interfaces, their IPs, and up/down status.", alt: ["show ip int br", "sh ip int br"] },
      { cmd: "show running-config", mode: "pr", desc: "Display the active configuration.", alt: ["show run", "sh run"] },
      { cmd: "show port-security interface fastEthernet 0/1", mode: "pr", desc: "Verify port-security state on a port.", alt: ["show port-security int f0/1"] },
    ],
  },
];

// Flat list for the drill
const ALL_STEPS = PHASES.flatMap((p) => p.steps);

const cmd = { mode: "ref", correct: 0, total: 0, current: null };

function normCmd(s) {
  return String(s).trim().toLowerCase().replace(/\s+/g, " ");
}

function initCommands() {
  const root = document.getElementById("commandsView");
  if (!root) return;
  root.innerHTML = `
    <section class="card">
      <div class="drill-head">
        <div class="seg">
          <button class="seg-btn active" data-cmode="ref">Reference</button>
          <button class="seg-btn" data-cmode="drill">Recall drill</button>
        </div>
        <div id="cmdActions" class="drill-actions"></div>
      </div>
      <div id="cmdBody"></div>
    </section>
  `;
  root.querySelectorAll(".seg-btn").forEach((b) => {
    b.addEventListener("click", () => {
      root.querySelectorAll(".seg-btn").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
      cmd.mode = b.dataset.cmode;
      renderCmd();
    });
  });
  renderCmd();
}

function renderCmd() {
  if (cmd.mode === "ref") renderCmdRef();
  else renderCmdDrill();
}

function modeBadge(m) {
  const x = MODES[m];
  return `<span class="mbadge m-${m}" title="${x.full}">${x.badge}</span>`;
}

function renderCmdRef() {
  document.getElementById("cmdActions").innerHTML = "";
  const legend = Object.entries(MODES)
    .map(([k, v]) => `${modeBadge(k)} ${v.full}`)
    .join("&nbsp;&nbsp;");
  const body = document.getElementById("cmdBody");
  body.innerHTML = `
    <div class="legend">${legend}</div>
    ${PHASES.map((ph) => `
      <div class="phase">
        <div class="phase-title">${ph.title}</div>
        <div class="phase-why">${ph.why}</div>
        <table class="cmd-table">
          <thead><tr><th>Mode</th><th>Command</th><th>What it does</th></tr></thead>
          <tbody>
            ${ph.steps.map((s) => `
              <tr>
                <td>${modeBadge(s.mode)}</td>
                <td><code>${s.cmd}</code>${s.alt.length ? `<span class="abbr">${s.alt[0]}</span>` : ""}</td>
                <td>${s.desc}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>`).join("")}
  `;
}

function renderCmdDrill() {
  document.getElementById("cmdActions").innerHTML =
    `<button id="cmdNew" class="btn primary">New</button>
     <button id="cmdReveal" class="btn">Reveal</button>`;
  newCmdQuestion();
  document.getElementById("cmdNew").addEventListener("click", newCmdQuestion);
  document.getElementById("cmdReveal").addEventListener("click", revealCmd);
}

function newCmdQuestion() {
  cmd.current = ALL_STEPS[Math.floor(Math.random() * ALL_STEPS.length)];
  const s = cmd.current;
  const body = document.getElementById("cmdBody");
  body.innerHTML = `
    <p class="prompt">Mode: ${modeBadge(s.mode)} <span class="mode-name">${MODES[s.mode].full}</span></p>
    <p class="cmd-task">${s.desc}</p>
    <div class="cmd-entry">
      <input id="cmdInput" type="text" placeholder="type the command"
        autocomplete="off" spellcheck="false" autocapitalize="off" />
      <button id="cmdCheck" class="btn primary">Check</button>
    </div>
    <div id="cmdFeedback" class="feedback"></div>
    <div class="cmd-score">Score: ${cmd.correct} / ${cmd.total}</div>
  `;
  const input = document.getElementById("cmdInput");
  input.focus();
  const submit = () => checkCmd();
  document.getElementById("cmdCheck").addEventListener("click", submit);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
}

function checkCmd() {
  const s = cmd.current;
  if (!s) return;
  const input = document.getElementById("cmdInput");
  const val = normCmd(input.value);
  if (!val) return;
  const accepted = [normCmd(s.cmd), ...s.alt.map(normCmd)];
  const ok = accepted.includes(val);
  cmd.total++;
  if (ok) cmd.correct++;
  input.classList.remove("cell-ok", "cell-bad");
  input.classList.add(ok ? "cell-ok" : "cell-bad");
  const fb = document.getElementById("cmdFeedback");
  fb.className = "feedback " + (ok ? "ok" : "bad");
  fb.innerHTML = ok
    ? "Correct."
    : `Not it. Answer: <code>${s.cmd}</code>`;
  document.querySelector(".cmd-score").textContent = `Score: ${cmd.correct} / ${cmd.total}`;
}

function revealCmd() {
  const s = cmd.current;
  if (!s) return;
  const input = document.getElementById("cmdInput");
  input.value = s.cmd;
  input.classList.remove("cell-bad");
  input.classList.add("cell-ok");
  const fb = document.getElementById("cmdFeedback");
  fb.className = "feedback warn";
  fb.innerHTML = s.alt.length
    ? `Answer: <code>${s.cmd}</code> &nbsp; (also: ${s.alt.map((a) => `<code>${a}</code>`).join(", ")})`
    : `Answer: <code>${s.cmd}</code>`;
}

/* Cisco Drill — vanilla JS
   Features:
   - Loads cisco_quiz_questions_v1.json
   - Shuffles questions and choices
   - Multiple guesses allowed until correct
   - Clear visual feedback for wrong/right
   - Auto-resets when version/count changes
   - Optional localStorage persistence
*/

const DATA_URL = "cisco_quiz_questions_v1.json";
const persistKey = "cisco_drill_state_v1";

const els = {
  progressBar: document.getElementById("progressBar"),
  progressText: document.getElementById("progressText"),
  domain: document.getElementById("domain"),
  difficulty: document.getElementById("difficulty"),
  questionText: document.getElementById("questionText"),
  choices: document.getElementById("choices"),
  feedback: document.getElementById("feedback"),
  explain: document.getElementById("explain"),
  explainText: document.getElementById("explainText"),
  refs: document.getElementById("refs"),
  nextBtn: document.getElementById("nextBtn"),
  resetBtn: document.getElementById("resetBtn"),
  persistToggle: document.getElementById("persistToggle"),
  card: document.getElementById("card"),
};

let bank = [];
let order = [];
let idx = 0;
let attemptsThisQ = 0;
let answeredCorrect = false;
let bankSig = "";

init();
bindNav();

let drillReady = false;
let commandsReady = false;
function bindNav() {
  const tabs = document.querySelectorAll(".tab");
  const views = {
    quiz: document.getElementById("quizView"),
    drill: document.getElementById("drillView"),
    commands: document.getElementById("commandsView"),
  };
  tabs.forEach((tab) => {
    tab.addEventListener("click", () => {
      const v = tab.dataset.view;
      tabs.forEach((t) => t.classList.toggle("active", t === tab));
      Object.entries(views).forEach(([k, el]) => el.classList.toggle("active", k === v));
      document.body.dataset.view = v;
      if (v === "drill" && !drillReady) { initSubnetDrill(); drillReady = true; }
      if (v === "commands" && !commandsReady) { initCommands(); commandsReady = true; }
    });
  });
}

async function init() {
  let data;
  try {
    const res = await fetch(DATA_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
  } catch (e) {
    failHard(
      "Could not load cisco_quiz_questions_v1.json. It must sit next to index.html " +
      "with that exact name. Note: opening index.html directly (file://) blocks this " +
      "fetch \u2014 use the GitHub Pages URL."
    );
    console.error(e);
    return;
  }
  bank = data.questions || [];
  bankSig = `${data.version || "unknown"}:${bank.length}`;
  console.log(`Loaded bank v${data.version} with ${bank.length} questions`);

  const saved = loadState();
  if (saved && saved.sig === bankSig) {
    order = saved.order;
    idx = saved.idx;
  } else {
    order = shuffle([...Array(bank.length).keys()]);
    idx = 0;
    attemptsThisQ = 0;
    answeredCorrect = false;
    saveState();
  }

  els.persistToggle.checked = !!saved;
  bindEvents();
  render();
}

function bindEvents() {
  els.nextBtn.addEventListener("click", () => {
    if (!answeredCorrect) return;
    idx++;
    if (idx >= order.length) {
      congrats();
      return;
    }
    answeredCorrect = false;
    attemptsThisQ = 0;
    render();
  });

  els.resetBtn.addEventListener("click", () => {
    order = shuffle([...Array(bank.length).keys()]);
    idx = 0;
    attemptsThisQ = 0;
    answeredCorrect = false;
    clearState();
    if (els.persistToggle.checked) saveState();
    render();
  });

  els.persistToggle.addEventListener("change", () => {
    if (els.persistToggle.checked) {
      saveState();
    } else {
      clearState();
    }
  });
}

function render() {
  if (els.persistToggle.checked) saveState();

  const q = bank[order[idx]];
  if (!q) return;

  els.domain.textContent = q.category || "";
  els.difficulty.textContent = (q.difficulty || "unknown").toUpperCase();
  els.questionText.textContent = q.question;
  els.feedback.textContent = "";
  els.feedback.className = "feedback";
  els.explain.classList.add("hidden");
  els.explainText.textContent = "";
  els.refs.innerHTML = "";
  els.nextBtn.disabled = true;

  els.choices.innerHTML = "";
  const choiceIndexes = shuffle(q.choices.map((_, i) => i));
  choiceIndexes.forEach((choiceIndex) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.type = "button";
    btn.style.color = "#fff"; // white text on buttons
    btn.setAttribute("role", "option");
    btn.textContent = q.choices[choiceIndex];
    btn.addEventListener("click", () => onChoice(q, btn, choiceIndex));
    els.choices.appendChild(btn);
  });

  const done = idx;
  const total = order.length;
  const pct = Math.round((done / total) * 100);
  els.progressBar.style.width = `${pct}%`;
  els.progressText.textContent = `${done} / ${total}`;
  attemptsThisQ = 0;
}

function onChoice(q, btn, chosenIndex) {
  if (answeredCorrect) return;

  const correctIndex = q.choices.indexOf(q.answer);
  attemptsThisQ++;

  if (chosenIndex === correctIndex) {
    answeredCorrect = true;
    btn.classList.remove("wrong");
    btn.classList.add("correct");
    els.feedback.textContent =
      attemptsThisQ === 1
        ? "Correct. Clean hit."
        : `Correct after ${attemptsThisQ} tries. Locked in.`;
    els.feedback.className = "feedback ok";
    [...els.choices.children].forEach((ch) => {
      if (ch !== btn) ch.setAttribute("disabled", "true");
    });
    if (q.explanation) els.explainText.textContent = q.explanation;
    if (Array.isArray(q.tags) && q.tags.length) {
      els.refs.innerHTML = q.tags
        .map((t) => `<span class="tag">${t}</span>`)
        .join(" ");
    }
    els.explain.classList.remove("hidden");
    els.nextBtn.disabled = false;
    confettiMini(els.card);
  } else {
    btn.classList.add("wrong");
    btn.setAttribute("disabled", "true");
    els.feedback.textContent = "Not it. Try again.";
    els.feedback.className = "feedback bad";
  }

  if (els.persistToggle.checked) saveState();
}

function congrats() {
  els.questionText.textContent = "All questions completed.";
  els.choices.innerHTML = "";
  els.feedback.textContent =
    "Nice work. Reset to run it again with a new order.";
  els.feedback.className = "feedback ok";
  els.explain.classList.add("hidden");
  els.nextBtn.disabled = true;
}

/* Utils */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function failHard(msg) {
  els.questionText.textContent = msg;
  els.choices.innerHTML = "";
  els.feedback.textContent = "Fix the file path or name, then refresh.";
  els.feedback.className = "feedback bad";
  els.nextBtn.disabled = true;
}

/* Persistence */
function saveState() {
  const state = { order, idx, sig: bankSig };
  try {
    localStorage.setItem(persistKey, JSON.stringify(state));
  } catch {}
}
function loadState() {
  try {
    const raw = localStorage.getItem(persistKey);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}
function clearState() {
  try {
    localStorage.removeItem(persistKey);
  } catch {}
}

/* Tiny confetti without deps */
function confettiMini(target) {
  const n = 18;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.style.position = "absolute";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = "0px";
    s.style.width = "6px";
    s.style.height = "10px";
    s.style.background = `hsl(${Math.random() * 360},80%,60%)`;
    s.style.borderRadius = "2px";
    s.style.transform = `translateY(0) rotate(${Math.random() * 360}deg)`;
    s.style.opacity = "0.95";
    s.style.pointerEvents = "none";
    target.appendChild(s);
    const dy = 80 + Math.random() * 120;
    const duration = 700 + Math.random() * 500;
    s.animate(
      [{ transform: `translateY(0)` }, { transform: `translateY(${dy}px)` }],
      { duration, easing: "ease-out" }
    );
    setTimeout(() => s.remove(), duration + 50);
  }
}
